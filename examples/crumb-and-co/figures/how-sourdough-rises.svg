<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <title>How sourdough rises</title>
  <desc>Three jars of dough left to right: just mixed, two hours later with small bubbles, and eight hours later doubled in size. A handwritten callout points at the bubbles and says "that's Gus at work".</desc>
  <rect width="800" height="360" fill="#fffbf5"/>
  <g stroke="#92400e" stroke-width="3" fill="#fde68a">
    <rect x="80" y="180" width="140" height="120" rx="14"/>
    <rect x="330" y="140" width="140" height="160" rx="14"/>
    <rect x="580" y="80" width="140" height="220" rx="14"/>
  </g>
  <g fill="#fffbf5" stroke="#92400e" stroke-width="2">
    <circle cx="370" cy="220" r="8"/>
    <circle cx="420" cy="250" r="6"/>
    <circle cx="620" cy="160" r="10"/>
    <circle cx="680" cy="210" r="8"/>
  </g>
  <text x="150" y="330" text-anchor="middle" font-family="Nunito" font-size="20" fill="#1f2937">Just mixed</text>
  <text x="400" y="330" text-anchor="middle" font-family="Nunito" font-size="20" fill="#1f2937">2 hours</text>
  <text x="650" y="330" text-anchor="middle" font-family="Nunito" font-size="20" fill="#1f2937">8 hours</text>
  <text x="470" y="60" font-family="Caveat" font-size="30" fill="#3b82f6">that's Gus at work</text>
  <path d="M465 52c-60 10-90 60-75 150" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
</svg>
