<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <title>How an online order reaches the oven (rejected)</title>
  <desc>Four gray rectangles labeled Website, Order system, Kitchen, and Pickup, joined by straight arrows with elbows. A callout's arrow starts from the top-right corner of its caption.</desc>
  <rect width="900" height="320" fill="#ffffff"/>
  <g fill="#e5e7eb" stroke="#111827" stroke-width="2">
    <rect x="40" y="110" width="160" height="80"/>
    <rect x="270" y="110" width="160" height="80"/>
    <rect x="500" y="110" width="160" height="80"/>
    <rect x="730" y="110" width="140" height="80"/>
  </g>
  <g font-family="Arial" font-size="18" text-anchor="middle" fill="#111827">
    <text x="120" y="156">Website</text>
    <text x="350" y="156">Order system</text>
    <text x="580" y="156">Kitchen</text>
    <text x="800" y="156">Pickup</text>
  </g>
  <path d="M200 150H270M430 150H500M660 150H730" stroke="#111827" stroke-width="2"/>
  <text x="330" y="270" font-family="Arial" font-size="16" fill="#111827">prints at 6:02am</text>
  <path d="M455 258L455 230L380 230L380 192" fill="none" stroke="#111827" stroke-width="2"/>
</svg>
